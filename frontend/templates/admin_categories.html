{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-8">
        <h3 class="fw-bold">Category Management</h3>
        <p class="text-muted">Manage default expense categories for all users</p>
    </div>
    <div class="col-4 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCatModal">
            <i class="bi bi-plus-lg"></i> Add Category
        </button>
    </div>
</div>

<div class="row">
    {% for c in categories %}
    <div class="col-md-3 mb-4">
        <div class="card p-4 text-center h-100 position-relative">
            {% if not c.is_default %}
            <form action="{{ url_for('admin.delete_category', cat_id=c.categoryID) }}" method="POST"
                class="position-absolute top-0 end-0 p-2">
                <button type="submit" class="btn text-danger p-0 border-0 bg-transparent"
                    onclick="return confirm('Delete this category?')">
                    <i class="bi bi-x-circle-fill"></i>
                </button>
            </form>
            {% else %}
            <div class="position-absolute top-0 end-0 p-2">
                <i class="bi bi-lock-fill text-muted" title="Default System Category"></i>
            </div>
            {% endif %}

            <div class="display-4 mb-2">{{ c.icon }}</div>
            <h5 class="fw-bold mb-0">{{ c.name }}</h5>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Add Modal -->
<div class="modal fade" id="addCatModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('admin.categories') }}">
                <div class="modal-body p-4 text-center">
                    <h5 class="fw-bold mb-4">New Category</h5>

                    <div class="mb-3 text-start">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Pets">
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label">Emoji Icon</label>
                        <input type="text" class="form-control" name="icon" required placeholder="🐕" maxlength="2">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Category</button>
                    <button type="button" class="btn btn-light w-100 mt-2" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
